<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100" viewBox="0 0 400 100">
  <!-- Background stylisé -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DAA520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond noir -->
  <rect width="400" height="100" fill="#000" />
  
  <!-- Symbole architectural en or -->
  <g transform="translate(65, 30) scale(0.6)">
    <!-- Bâtiment stylisé -->
    <path d="M10,60 L30,10 L60,10 L80,60 Z" stroke="url(#goldGradient)" stroke-width="2" fill="none" />
    <!-- Colonnes -->
    <path d="M25,60 L25,30" stroke="url(#goldGradient)" stroke-width="3" fill="none" />
    <path d="M40,60 L40,20" stroke="url(#goldGradient)" stroke-width="3" fill="none" />
    <path d="M55,60 L55,20" stroke="url(#goldGradient)" stroke-width="3" fill="none" />
    <path d="M70,60 L70,30" stroke="url(#goldGradient)" stroke-width="3" fill="none" />
    <!-- Toit -->
    <path d="M20,15 L45,5 L70,15" stroke="url(#goldGradient)" stroke-width="3" fill="none" />
  </g>
  
  <!-- Texte OMARI avec style luxueux -->
  <text x="140" y="55" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#DAA520" letter-spacing="2">OMARI</text>
  
  <!-- Ligne décorative -->
  <line x1="140" y1="60" x2="350" y2="60" stroke="#DAA520" stroke-width="2" />
  
  <!-- Texte CONSTRUCTION GROUP -->
  <text x="150" y="80" font-family="Arial, sans-serif" font-size="16" fill="#DAA520" letter-spacing="1">CONSTRUCTION GROUP</text>
</svg>