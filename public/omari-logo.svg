<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>
  
  <!-- Left circle with skyline -->
  <circle cx="120" cy="120" r="100" stroke="url(#goldGradient)" stroke-width="6" fill="none"/>
  
  <!-- Skyline buildings inside circle -->
  <g fill="none" stroke="url(#goldGradient)" stroke-width="2.5">
    <path d="M80,180 L80,120 L95,120 L95,140 L110,140 L110,110 L125,110 L125,180" />
    <path d="M130,180 L130,100 L140,80 L150,100 L150,180" />
    <path d="M155,180 L155,130 L170,130 L170,180" />
    <path d="M175,180 L175,115 L190,115 L190,180" />
  </g>
  
  <!-- OMARI text -->
  <text x="260" y="140" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#goldGradient)">OMARI</text>
  
  <!-- CONSTRUCTION GROUP text -->
  <text x="270" y="180" font-family="Arial, sans-serif" font-size="30" letter-spacing="1" fill="url(#goldGradient)">CONSTRUCTION GROUP</text>
</svg>